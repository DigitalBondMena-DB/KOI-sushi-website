<swiper-container loop="true" slides-per-view="1" space-between="30" pagination="true" pagination-clickable="true"
  breakpoints='{"768": {"slidesPerView": 2}, "1200": {"slidesPerView": 3}}' class="w-full pb-14">
  @for (item of sliderData() ?? []; track item.id) {
  <swiper-slide>
    <div class="bg-white p-10 rounded-3xl shadow-xl shadow-dark/5 my-8 relative h-full flex flex-col">
      <div class="text-primary mb-6">
        <div class="flex space-x-1">
          @for (i of [1, 2, 3, 4, 5]; track i) {
          <span class="text-xl">★</span>
          }
        </div>
      </div>
      <div class="text-dark/70 text-lg italic mb-8 line-clamp-1"  [innerHtml]="item.comment | safeHtml"></div>
      <div class="flex items-center space-x-4">
        <div class="w-12 h-12 bg-primary/20 rounded-full flex items-center justify-center text-primary font-bold ">
          {{ item.title?.[0] ?? 'U' }}
        </div>
        <div>
          <h5 class="font-bold text-dark line-clamp-1" [title]="item.title">{{ item.title }}</h5>
        </div>
      </div>
    </div>
  </swiper-slide>
  }
</swiper-container>
