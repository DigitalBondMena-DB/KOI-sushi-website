<section class="py-24 bg-dark text-light">
  <div class="container mx-auto px-4">
    <app-main-header [mainTitle]="'Best Sellers'" [subTitle]="'Must Try'" />

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
      @for (product of bestSellers; track product.id) {
        <div
          class="group bg-white/5 rounded-3xl overflow-hidden hover:bg-white/10 transition-all duration-500 hover:-translate-y-2"
        >
          <div class="relative aspect-square overflow-hidden">
            <img
              [src]="product.image"
              [alt]="product.name"
              loading="lazy"
              decoding="async"
              class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700"
            />
            <div
              class="absolute top-4 inset-e-4 bg-primary text-light text-xs font-bold px-3 py-1 rounded-full uppercase"
            >
              Popular
            </div>
          </div>
          <div class="p-6 text-center">
            <h4 class="text-xl font-bold mb-2">{{ product.name }}</h4>
            <p class="text-light/50 text-sm mb-4">{{ product.description }}</p>
            <div class="text-primary font-bold text-xl">{{ product.price }}</div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
