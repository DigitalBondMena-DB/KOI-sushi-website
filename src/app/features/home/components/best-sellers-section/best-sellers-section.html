<section class="py-24 bg-dark text-light content-visibility-section">
  <div class="container mx-auto px-4">
    <app-main-header [mainTitle]="'HOME.BEST_SELLERS.TITLE' | translate"
      [subTitle]="'HOME.BEST_SELLERS.SUB_TITLE' | translate" />

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
      @for (product of bestSellers(); track product.id) {
      <div
        class="group bg-white/5 rounded-3xl overflow-hidden hover:bg-white/10 transition-all duration-500 hover:-translate-y-2 flex flex-col">
        <div class="relative aspect-square overflow-hidden">
          <img [appMediaUrl]="product.image" [alt]="product.title" loading="lazy" decoding="async"
            class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" />
          <div
            class="absolute top-4 inset-e-4 bg-primary text-light text-xs font-bold px-3 py-1 rounded-full uppercase">
            {{ 'HOME.BEST_SELLERS.POPULAR' | translate }}
          </div>
        </div>
        <div class="pt-6 text-center">
          <h4 class="text-xl font-bold mb-2">{{ product.title }}</h4>
          <div class="text-light/50 text-sm mb-4" [innerHTML]=" product.description | safeHtml"></div>
        </div>
                  <div class="text-primary font-bold text-xl mt-auto mx-auto pb-6">{{ product.price}} {{"HOME.BEST_SELLERS.EGP" | translate}}</div>

      </div>
      }
    </div>
  </div>
</section>
