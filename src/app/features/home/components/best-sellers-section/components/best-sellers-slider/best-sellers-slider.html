<swiper-container loop="true" observer="true" observe-parents="true" slides-per-view="1" space-between="16"
  autoplay-delay="3000" autoplay-disable-on-interaction="false"
  breakpoints='{"640": {"slidesPerView": 2}, "1024": {"slidesPerView": 3}, "1280": {"slidesPerView": 4}}'
  class="w-full">
  @for (product of bestSellers(); track product.id) {
  <swiper-slide class="h-auto">
    <div
      class="group bg-white/5 rounded-3xl overflow-hidden hover:bg-white/10 transition-all duration-500 flex flex-col h-full mx-2">
      <div class="relative aspect-square overflow-hidden">
        <img [appMediaUrl]="product.image" [alt]="product.title" loading="lazy" decoding="async"
          class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" />
        <div class="absolute top-4 inset-e-4 bg-primary text-light text-xs font-bold px-3 py-1 rounded-full uppercase">
          {{ 'HOME.BEST_SELLERS.POPULAR' | translate }}
        </div>
      </div>
      <div class="pt-6 text-center px-4">
        <h4 class="text-xl font-bold mb-2 line-clamp-2" [title]="product.title">{{ product.title }}</h4>
        <div class="text-light/50 text-sm mb-4 line-clamp-3" [innerHTML]=" product.description | safeHtml"></div>
      </div>
      <span class="text-primary font-bold text-xl mt-auto mx-auto pb-6">{{ product.price}} {{"HOME.BEST_SELLERS.EGP" |
        translate}}</span>
    </div>
  </swiper-slide>
  }
</swiper-container>
