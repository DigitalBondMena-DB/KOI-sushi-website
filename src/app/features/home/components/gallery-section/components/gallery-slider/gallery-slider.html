<swiper-container loop="true" slides-per-view="2" space-between="16" autoplay-delay="3000"
  autoplay-disable-on-interaction="false"
  breakpoints='{"768": {"slidesPerView": 3}, "1024": {"slidesPerView": 4}, "1280": {"slidesPerView": 5}}'
  class="w-full">
  @for (img of Images(); track $index) {
  <swiper-slide lazy="true">
    <div class="aspect-4/5 rounded-2xl overflow-hidden mx-2">
      <img [appMediaUrl]="img.image" loading="lazy" decoding="async" alt="Gallery Image"
        class="w-full h-full object-cover hover:scale-105 transition-transform duration-700" />
    </div>
  </swiper-slide>
  }
</swiper-container>
