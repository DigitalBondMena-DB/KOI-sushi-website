<section class="relative h-screen min-h-[600px] overflow-hidden">
  <swiper-container
    [attr.dir]="langService.currentLang() === 'ar' ? 'rtl' : 'ltr'"
    loop="true"
    pagination="true"
    pagination-clickable="true"
    autoplay-delay="5000"
    autoplay-disable-on-interaction="false"
    speed="700"
    effect="fade"
    class="w-full h-full theme-light-bullets"
  >
    @for (slide of slides; track slide.id) {
      <swiper-slide>
        <div class="relative h-screen w-full cursor-grab">
          <!-- Background Image -->
          <img
            [ngSrc]="slide.image"
            [alt]="slide.title"
            [priority]="$index === 0"
            [decoding]="$index > 0 ? 'async' : 'sync'"
            fill
            class="absolute inset-0 size-full object-cover"
          />

          <!-- Overlay -->
          <div
            class="absolute inset-0 bg-linear-to-r from-dark/80 via-dark/40 to-transparent rtl:bg-linear-to-l"
          ></div>

          <!-- Content -->
          <div class="absolute inset-0 flex items-center">
            <div class="container mx-auto px-4">
              <div class="max-w-2xl space-y-6 animate-slide-up">
                <h2 class="text-primary text-brand-voice text-3xl md:text-4xl">
                  {{ slide.subtitle | translate }}
                </h2>
                <h1 class="text-light text-5xl md:text-7xl font-bold leading-tight">
                  {{ slide.title | translate }}
                </h1>
                <p class="text-light/80 text-lg md:text-xl max-w-lg">
                  {{ slide.description | translate }}
                </p>
                <div class="flex gap-4">
                  <a
                    [routerLink]="'/' + langService.currentLang() + slide.link"
                    class="bg-primary text-light px-8 py-4 rounded-full font-bold hover:bg-primary/90 transition-all flex items-center gap-2"
                  >
                    <span>{{ 'HOME.ORDER_NOW' | translate }}</span>
                    <img
                      src="/assets/icons/arrow-right.svg"
                      width="24"
                      height="24"
                      loading="lazy"
                      decoding="async"
                      alt=""
                      role="presentation"
                    />
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </swiper-slide>
    }
  </swiper-container>
</section>
