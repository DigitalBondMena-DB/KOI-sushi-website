<div class="fixed inset-0 z-50 flex items-center justify-center bg-dark/60 backdrop-blur-md transition-all duration-350">
  <div class="bg-white rounded-[2.5rem] p-8 md:p-12 max-w-md w-full mx-4 shadow-2xl border border-dark/5 text-center relative overflow-hidden animate-slide-up">
    <!-- Close icon top-right -->
    <button (click)="close()" class="absolute top-6 right-6 text-dark/30 hover:text-dark/80 transition-colors p-2 hover:bg-dark/5 rounded-full transition-all duration-200" aria-label="Close">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <!-- Success Checkmark Badge -->
    <div class="w-20 h-20 bg-emerald-50 rounded-full flex items-center justify-center mx-auto mb-6 text-emerald-500 relative">
      <div class="absolute inset-0 rounded-full bg-emerald-500/15 animate-ping opacity-75"></div>
      <svg class="w-10 h-10 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
      </svg>
    </div>

    <!-- Content -->
    <h3 class="text-2xl font-black text-dark mb-3 tracking-tight">
      {{ 'CONTACT.SUCCESS_TITLE' | translate }}
    </h3>
    <p class="text-dark/60 mb-8 text-sm md:text-base leading-relaxed px-2">
      {{ 'CONTACT.SUCCESS_MESSAGE' | translate }}
    </p>

    <!-- Done Button -->
    <button (click)="close()" class="w-full bg-primary text-light py-4 rounded-2xl font-bold hover:bg-primary/95 hover:scale-[1.01] active:scale-[0.99] transition-all duration-200 shadow-lg shadow-primary/20 hover:shadow-primary/35">
      {{ 'CONTACT.SUCCESS_CLOSE' | translate }}
    </button>
  </div>
</div>
