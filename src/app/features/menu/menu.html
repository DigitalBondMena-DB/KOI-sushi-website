<div class="pt-24 pb-12 bg-light min-h-screen">
  <div class="container mx-auto px-4">
    <!-- Header -->
    <div class="text-center mb-12 space-y-4">
      <app-main-header mainTitle="Discover Deliciousness" subTitle="Our Menu" />
      <p class="text-dark/50 max-w-lg mx-auto">
        Explore our wide variety of handcrafted sushi, appetizers, and signature rolls.
      </p>
    </div>

    <!-- PDF Viewer Controls -->
    <div
      class="bg-white rounded-2xl shadow-xl shadow-dark/5 p-4 mb-8 flex flex-wrap items-center justify-between gap-4 sticky top-24 z-30 border border-dark/5"
    >
      <div class="flex items-center gap-2">
        <button
          (click)="zoomOut()"
          class="p-2 hover:bg-light rounded-lg transition-colors text-dark/70"
        >
          <!-- <lucide-icon [name]="icons.zoomOut" size="20"></lucide-icon> -->
        </button>
        <span class="text-sm font-bold text-dark w-12 text-center"
          >{{ (zoom() * 100).toFixed(0) }}%</span
        >
        <button
          (click)="zoomIn()"
          class="p-2 hover:bg-light rounded-lg transition-colors text-dark/70"
        >
          <!-- <lucide-icon [name]="icons.zoomIn" size="20"></lucide-icon> -->
        </button>
      </div>

      <div class="flex items-center gap-4">
        <a
          href="assets/menu.pdf"
          download
          class="flex items-center gap-2 bg-primary text-light px-6 py-2 rounded-full font-bold text-sm hover:bg-primary/90 transition-all shadow-lg shadow-primary/20"
        >
          <!-- <lucide-icon [name]="icons.download" size="16"></lucide-icon> -->
          <span>Download PDF</span>
        </a>
      </div>
    </div>

    <!-- Viewer Container -->
    <div
      class="bg-dark/5 rounded-3xl overflow-hidden min-h-[600px] relative border-4 border-white shadow-2xl"
    >
      <pdf-viewer
        [src]="pdfSrc"
        [render-text]="true"
        [original-size]="false"
        [zoom]="zoom()"
        style="width: 100%; height: 800px"
        class="animate-fade-in"
      ></pdf-viewer>
    </div>
  </div>
</div>
