@if(isLoading()) {
<app-loading-screen />
}
<div class="pt-24 pb-12 bg-light min-h-screen">
  <div class="container mx-auto px-4">
    <!-- Header -->
    <div class="text-center mb-12 space-y-4">
      <app-main-header [mainTitle]="'MENU.DISCOVER' | translate" [subTitle]="'MENU.TITLE' | translate" />
      <p class="text-dark/50 max-w-lg mx-auto">
        {{ 'MENU.SUBTITLE' | translate }}
      </p>
    </div>

    <!-- Viewer Container -->
    @if (menuUrl()) {
    <div class="bg-dark/5 rounded-3xl overflow-hidden min-h-150 relative border-4 border-white shadow-2xl h-200">
      <img class="size-16 rounded absolute inset-e-3 top-3 m-auto z-10" width="40" height="40"
        src="assets/images/koi-logo.jpg" alt="" role="presentation">
      <iframe [src]="sanitizer.bypassSecurityTrustResourceUrl(menuUrl())"
        class="w-full h-full border-none animate-fade-in" allow="autoplay">
      </iframe>
    </div>
    } @else {
    <div class="flex justify-center items-center h-64">
      <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary"></div>
    </div>
    }
  </div>
</div>
