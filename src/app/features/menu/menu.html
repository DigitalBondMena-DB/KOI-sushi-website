@if(isLoading()) {
<app-loading-screen />
}
<div class="pt-24 pb-12 bg-light min-h-screen">
  <div class="container mx-auto px-4">
    <!-- Header -->
    <div class="text-center mb-12 space-y-4">
      <app-main-header [mainTitle]="'MENU.DISCOVER' | translate" [subTitle]="'MENU.TITLE' | translate" />
      <p class="text-dark/50 max-w-lg mx-auto">
        {{ 'MENU.SUBTITLE' | translate }}
      </p>
    </div>

    <!-- PDF Viewer Controls -->
    <div
      class="bg-white rounded-2xl shadow-xl shadow-dark/5 p-4 mb-8 flex flex-wrap items-center justify-between gap-4 sticky top-24 z-30 border border-dark/5">
      <div class="flex items-center gap-2">
        <button (click)="zoomOut()" class="p-2 hover:bg-light rounded-lg transition-colors text-dark/70">
          <!-- <lucide-icon [name]="icons.zoomOut" size="20"></lucide-icon> -->
        </button>
        <span class="text-sm font-bold text-dark w-12 text-center">{{ (zoom() * 100).toFixed(0) }}%</span>
        <button (click)="zoomIn()" class="p-2 hover:bg-light rounded-lg transition-colors text-dark/70">
          <!-- <lucide-icon [name]="icons.zoomIn" size="20"></lucide-icon> -->
        </button>
      </div>
    </div>

    <!-- Viewer Container -->
    @if (pdfSrc()) {
    <div class="bg-dark/5 rounded-3xl overflow-hidden min-h-[600px] relative border-4 border-white shadow-2xl">
      <pdf-viewer [src]="pdfSrc()" [render-text]="true" [original-size]="false" [zoom]="zoom()"
        style="width: 100%; height: 800px" class="animate-fade-in"></pdf-viewer>
    </div>
    } @else {
    <div class="flex justify-center items-center h-64">
      <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary"></div>
    </div>
    }
  </div>
</div>
