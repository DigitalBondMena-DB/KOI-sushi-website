<section class="py-24 overflow-hidden content-visibility-section" [class]="class()">
  <div class="container mx-auto">
    @if (story(); as s) {
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
      <div class="relative rounded-4xl overflow-hidden">
        <div class="absolute -top-10 -left-10 w-64 h-64 bg-primary/10 rounded-full blur-3xl"></div>
        <img [appMediaUrl]="s.story_image" alt="About KOI"
          sizes="(min-width: 1024px) 50vw, (min-width: 768px) 41vw, 100vw" loading="lazy" decoding="async"
          class="w-full h-full object-cover" />
      </div>
      <div class="space-y-8">
        <h2 class="text-primary text-brand-voice text-3xl">{{ 'OUR_STORY' | translate }}</h2>
        <h3 class="text-4xl md:text-5xl font-bold line-clamp-2" [title]="s.title">{{ s.title }}</h3>
        <div class="text-lg leading-relaxed lg:max-h-22.5 lg:overflow-y-auto" [innerHTML]="s.description | safeHtml">
        </div>
      </div>
    </div>
    }
  </div>
</section>
