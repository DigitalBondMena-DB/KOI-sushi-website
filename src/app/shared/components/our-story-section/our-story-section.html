<section class="py-24 overflow-hidden content-visibility-section" [class]="class()">
  <div class="container mx-auto px-4">
    @if (story(); as s) {
    <div class="grid md:grid-cols-2 gap-16 items-center">
      <div class="relative rounded-4xl overflow-hidden">
        <div class="absolute -top-10 -left-10 w-64 h-64 bg-primary/10 rounded-full blur-3xl"></div>
        <img
          [appMediaUrl]="s.story_image"
          alt="About KOI"
          sizes="(min-width: 1024px) 50vw, (min-width: 768px) 41vw, 100vw"
          loading="lazy"
          decoding="async"
          class="w-full h-full object-cover"
        />
      </div>
      <div class="space-y-8">
        <h2 class="text-primary text-brand-voice text-3xl italic">{{ 'HOME.ABOUT.OUR_STORY' | translate }}</h2>
        <h3 class="text-4xl md:text-5xl font-bold">{{ s.title }}</h3>
        <div class="text-lg leading-relaxed max-h-22.5 overflow-y-auto" [innerHTML]="s.description | safeHtml"></div>
        <a
          [routerLink]="'/' + langService.currentLang() + '/about'"
          class="inline-block border-b-2 border-primary text-primary font-bold pb-1 hover:border-dark hover:text-dark transition-all"
        >
          {{ 'HOME.ABOUT.DISCOVER_MORE' | translate }}
        </a>
      </div>
    </div>
    }
  </div>
</section>
